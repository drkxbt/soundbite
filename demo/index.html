<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>soundbite</title>
  <meta name="description" content="Turn the best minute of a Space or a podcast into a captioned video for X, in the browser. The words are transcribed and timed on your device, and nothing is uploaded.">
  <meta name="theme-color" content="#0c0c0d">
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../dist/app/soundbite.css">
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="demo.js"></script>
</head>
<body>
  <main class="page">
    <header class="top">
      <span class="name" translate="no">soundbite</span>
      <a class="ag-btn top-key" href="https://github.com/drkxbt/soundbite" aria-label="Soundbite on GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 19.5c-4 1.2-4-2-5.5-2.5m11 4.5v-3.4c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.3 4.3 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.2 5.4 3.2a4.3 4.3 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.6c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2v3.9"/></svg>
      </a>
    </header>
    <section class="intro">
      <h1>The best minute of your Space, as a video for X</h1>
      <p>Open the recording, drag over the moment, and the words are written out and timed as they are said. Pick a look and download an MP4. Everything runs on this device, so the audio is never uploaded. <button class="sample" type="button" data-sample>Try it on a sample Space</button></p>
    </section>
    <div class="app" data-app></div>
  </main>
</body>
</html>
